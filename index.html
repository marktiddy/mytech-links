const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// Line icons in the style of the channel banner
const svg = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const ICONS = {
  sensor: svg('<circle cx="12" cy="12" r="2"/><path d="M8.5 8.5a5 5 0 0 0 0 7M15.5 8.5a5 5 0 0 1 0 7M5.6 5.6a9 9 0 0 0 0 12.8M18.4 5.6a9 9 0 0 1 0 12.8"/>'),
  thermo: svg('<path d="M14 14.8V5a2 2 0 0 0-4 0v9.8a4 4 0 1 0 4 0Z"/><path d="M12 9v7"/>'),
  blinds: svg('<path d="M4 4h16M5 4v12M19 4v12M5 8h14M5 12h14M5 16h14M12 16v4"/><circle cx="12" cy="20.5" r=".6"/>'),
  lock:   svg('<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3M12 15v2"/>'),
  vacuum: svg('<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3"/><path d="M8 5.8h8"/>'),
  paw:    svg('<circle cx="7" cy="10" r="1.6"/><circle cx="10" cy="6.5" r="1.6"/><circle cx="14" cy="6.5" r="1.6"/><circle cx="17" cy="10" r="1.6"/><path d="M12 11c-2.5 0-5 3.5-5 6a2.5 2.5 0 0 0 3 2.4 7 7 0 0 1 4 0 2.5 2.5 0 0 0 3-2.4c0-2.5-2.5-6-5-6Z"/>'),
  plug:   svg('<path d="M9 3v5M15 3v5M6 8h12v3a6 6 0 0 1-12 0V8ZM12 17v4"/>'),
  wifi:   svg('<path d="M2.5 9a14 14 0 0 1 19 0M5.5 12.5a9.5 9.5 0 0 1 13 0M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19" r=".8" fill="currentColor"/>'),
  car:    svg('<path d="M5 16V12l2-5h10l2 5v4M3 16h18v3H3zM5 12h14"/><circle cx="7.5" cy="14" r=".6"/><circle cx="16.5" cy="14" r=".6"/>'),
  camera: svg('<rect x="3" y="7" width="13" height="10" rx="2"/><path d="m16 11 5-3v8l-5-3"/><circle cx="9.5" cy="12" r="2"/>'),
  light:  svg('<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3Z"/>'),
  house:  svg('<path d="M3 11 12 4l9 7M5 9.5V20h14V9.5"/><circle cx="12" cy="14" r="1.6"/><path d="M12 15.6V18M10.6 13.2 8.5 12M13.4 13.2l2.1-1.2"/>'),
  fan:    svg('<circle cx="12" cy="12" r="1.6"/><path d="M12 10.4C11 6 12 3 14.5 3S17 7 13.4 11.3M13.6 12c4.4-1 7.4 0 7.4 2.5S17 17 12.7 13.4M12 13.6c1 4.4 0 7.4-2.5 7.4S7 17 10.6 12.7M10.4 12C6 13 3 12 3 9.5S7 7 11.3 10.6"/>'),
  star:   svg('<path d="m12 3 2.8 5.8 6.2.8-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.8Z"/>'),
};
const BRAND = {
  yt: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8ZM9.6 15.6V8.4l6.3 3.6-6.3 3.6Z"/></svg>',
  ig: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>'
};

// Header
$("tagline").textContent = SITE.tagline;
$("avatar").alt = "Mark";
$("disclosure").textContent = SITE.disclosure;
$("year").textContent = new Date().getFullYear();
$("socials").innerHTML =
  `<a class="btn yt" href="${esc(SITE.youtube)}?sub_confirmation=1" target="_blank" rel="noopener">${BRAND.yt}Subscribe on YouTube</a>` +
  (SITE.instagram ? `<a class="btn" href="${esc(SITE.instagram)}" target="_blank" rel="noopener">${BRAND.ig}Instagram</a>` : "");

// Featured app
const f = FEATURED_APP, fe = $("feature");
fe.href = f.url;
fe.innerHTML = `<div class="icon" id="appicon">📱</div>
  <div><div class="eyebrow">My app</div><h2>${esc(f.name)}</h2><p>${esc(f.blurb)}</p></div>
  <span class="go">${esc(f.cta)}</span>`;
if (f.icon) { const i = new Image(); i.alt = ""; i.onload = () => { $("appicon").textContent = ""; $("appicon").appendChild(i); }; i.src = f.icon; }

// Filters
let active = "all", query = "";
const used = Object.keys(CATEGORIES).filter(k => PRODUCTS.some(p => p.category === k));
$("chips").innerHTML = [["all", "All"], ...used.map(k => [k, CATEGORIES[k].label])]
  .map(([k, l]) => `<button class="chip" data-cat="${k}" aria-pressed="${k === active}">${esc(l)}</button>`).join("");
$("chips").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  active = b.dataset.cat;
  document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === b));
  render();
});
const syncBrands = () => document.querySelectorAll(".brand").forEach(b => b.setAttribute("aria-pressed", b.dataset.q === query));
$("search").addEventListener("input", e => { query = e.target.value.trim().toLowerCase(); syncBrands(); render(); });

// Brand quick filters (toggle a search for the brand name)
$("brands").innerHTML = "Brands I use daily:" + BRANDS.map(b =>
  `<button class="brand" data-q="${esc(b.toLowerCase())}" aria-pressed="false">${esc(b)}</button>`).join("");
$("brands").addEventListener("click", e => {
  const b = e.target.closest(".brand"); if (!b) return;
  query = query === b.dataset.q ? "" : b.dataset.q;
  $("search").value = query ? b.textContent : "";
  syncBrands(); render();
});

// Popular videos
$("morevids").href = SITE.youtube + "/videos";
$("vids").innerHTML = VIDEOS.map(v => `<a class="vid" href="https://www.youtube.com/watch?v=${esc(v.id)}" target="_blank" rel="noopener">
  <div class="thumb"><img loading="lazy" alt="" src="https://i.ytimg.com/vi/${esc(v.id)}/mqdefault.jpg"></div>
  <p>${esc(v.title)}</p></a>`).join("");

// "Watch review" buttons inside product rows (don't follow the product link)
$("list").addEventListener("click", e => {
  const w = e.target.closest(".watch"); if (!w) return;
  e.preventDefault(); e.stopPropagation();
  window.open("https://www.youtube.com/watch?v=" + encodeURIComponent(w.dataset.v), "_blank", "noopener");
});

// Copy discount code (doesn't follow the link)
$("list").addEventListener("click", e => {
  const b = e.target.closest(".code"); if (!b) return;
  e.preventDefault(); e.stopPropagation();
  navigator.clipboard?.writeText(b.dataset.code).then(() => {
    const old = b.textContent; b.textContent = "Copied ✓"; setTimeout(() => b.textContent = old, 1500);
  }).catch(() => {});
});

function render() {
  const items = PRODUCTS
    .map((p, i) => ({ ...p, i }))
    .filter(p => (active === "all" || p.category === active) &&
                 (!query || p.name.toLowerCase().includes(query) || (CATEGORIES[p.category]?.label || "").toLowerCase().includes(query)))
    .sort((a, b) => (b.new ? 1 : 0) - (a.new ? 1 : 0) || a.i - b.i);
  $("count").textContent = `${items.length} item${items.length === 1 ? "" : "s"}`;
  $("list").innerHTML = items.length ? items.map(p => {
    const c = CATEGORIES[p.category] || { label: "", icon: "star" };
    return `<a class="item" href="${esc(p.url)}" target="_blank" rel="noopener sponsored">
      <span class="node" aria-hidden="true">${ICONS[p.icon] || ICONS[c.icon] || ICONS.star}</span>
      <span class="body">
        <span class="name">${esc(p.name)}</span>
        <span class="meta">${p.new ? '<span class="badge">New</span>' : ""}${esc(p.note || c.label)}</span>
        ${p.video || p.code ? "<br>" : ""}${p.video ? `<button class="watch" data-v="${esc(p.video)}">▶ Watch review</button>` : ""}${p.code ? `<button class="code" data-code="${esc(p.code)}" title="Copy code">${esc(p.code)} ⧉</button>` : ""}
      </span>
      <span class="arrow" aria-hidden="true">→</span>
    </a>`;
  }).join("") : `<p class="empty">Nothing matches “${esc(query)}”.</p>`;
}
render();
</script>

</body>
